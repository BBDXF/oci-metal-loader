name: ISO (manual)

# On-demand ISO build (the ISO is NOT built on every push). Actions tab -> "ISO (manual)" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      smoke:
        description: "Also boot the ISO under QEMU and wait for the shell-ready marker"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe for the version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools zip
      - name: Build (docker; see build/README.md)
        env:
          CONTAINER_ENGINE: docker
          DEBIAN_MIRROR: http://deb.debian.org/debian
        run: make iso
      - name: Config package
        run: build/mk-config-pkg.sh
      - run: ls -l out/ && cat out/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: omloader-iso
          path: |
            out/omloader-*.iso
            out/omloader-*-config.zip
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - name: QEMU smoke test (optional; not proven on runners yet)
        if: ${{ inputs.smoke }}
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          test/smoke-local.sh
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.smoke }}
        with:
          name: smoke-serial-log
          path: work/smoke-serial.log
          if-no-files-found: ignore
