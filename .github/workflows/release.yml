name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. 0.1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # create the release and upload assets
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      CONTAINER_ENGINE: docker
      DEBIAN_MIRROR: http://deb.debian.org/debian
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends squashfs-tools zip
      - name: Test
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Build binary + ISO
        run: |
          export OML_VERSION="${TAG#v}"
          make iso
          echo "VERSION=$OML_VERSION" >> "$GITHUB_ENV"
      - name: Package
        run: |
          mkdir -p dist
          cp out/omloader-${VERSION}.iso out/omloader-${VERSION}-packages.txt dist/
          tar -C bin -czf dist/omloader-${VERSION}-linux-amd64.tar.gz omloader
          OML_VERSION="$VERSION" build/mk-config-pkg.sh && cp out/omloader-${VERSION}-config.zip dist/
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
          # pre-release while the major version is 0
          case "$VERSION" in 0.*) echo "PRERELEASE=true" >> "$GITHUB_ENV";; *) echo "PRERELEASE=false" >> "$GITHUB_ENV";; esac
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: OCI Metal Loader ${{ env.VERSION }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          generate_release_notes: true
          body: |
            Debian live base: see `omloader version --long` in the live system, `omloader-release` at the ISO root, and the attached `omloader-${{ env.VERSION }}-packages.txt`.
          fail_on_unmatched_files: true
          files: |
            dist/omloader-${{ env.VERSION }}.iso
            dist/omloader-${{ env.VERSION }}-packages.txt
            dist/omloader-${{ env.VERSION }}-linux-amd64.tar.gz
            dist/omloader-${{ env.VERSION }}-config.zip
            dist/SHA256SUMS
