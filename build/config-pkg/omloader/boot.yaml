# OCI Metal Loader: global config, read at boot from <this partition>/omloader/boot.yaml
# (the same file name is also read from an OMLOADER partition). Every key is optional;
# uncomment and edit what you need. Full key reference: docs/INSTALL.md (section 9), schema: schema/omloader.schema.json
# Check after editing:  omloader config validate -c boot.yaml

# --- auto-boot an image after a countdown (Ventoy cannot pass kernel parameters) ---
# boot:
#   default_image: ubuntu-noble   # folder name under omloader/images/; empty = show the TUI
#   default_snapshot: current     # current | base | a snapshot label (label/base = throwaway boot)
#   timeout: 10                   # seconds; any key cancels (the TUI shows the countdown, minimum 5 s)
#   ui: tui                       # tui | shell (what the console shows when nothing boots)

# --- the default login is PUBLIC (oci / Oci123, root with the same password): change it! ---
# guest_defaults:
#   autologin: false
#   root_password_hash: "!"       # lock root (or a $6$... hash from `openssl passwd -6`)
#   users:
#     - {name: alice, password_hash: "$6$...", sudo: true, ssh_authorized_keys: ["ssh-ed25519 AAAA... alice@pc"]}

# --- host disks in guests: show this machine's disks/partitions (e.g. this data partition) under /mnt/disks/<disk>/<label> ---
# guest_defaults:
#   host_disks:
#     mode: ro               # off (default) | ro | rw   (NTFS: disable Windows Fast Startup/hibernation first)
#     disks: boot            # boot = only the disk holding this partition | all
#     # mount_root: /mnt/disks
#     # force_rw_data: false # with mode rw, also make omloader/ on this partition writable (do NOT delete omloader/store.img)

# --- network / mirrors (China: region_preset cn tries the cn mirrors as fallbacks) ---
# mirror_policy:
#   region_preset: cn
# network:
#   proxy: "http://proxy.lan:3128"
#   no_proxy: ".lan"

# --- store file: keep snapshots/data in an ext4 image file on this partition (create it with
#     `omloader store create --path /mnt/images/omloader/store.img --size 20G`) ---
# storage:
#   snapshots:
#     store_file:
#       size: 20G
#       # auto_create: true     # default: when no store exists, create omloader/store.img (ext4, label OMLOADER) at boot
#       # size: 20G             # size of that file; shrunk to what fits (>= 4G) with a 1G margin, else skipped
