serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=10   # menu visible long enough for a late VNC/KVM viewer; tests shorten it via extra.cfg (set timeout=1)
set default=0
set omloader_args=""
# test harness may inject extra.cfg (sets omloader_args) via xorriso
if [ -f /boot/grub/extra.cfg ]; then source /boot/grub/extra.cfg; fi
# Ventoy GRUB2 mode runs this file with the ISO loop-mounted: hint stage 1 which file to loop-mount (it also finds it by scanning)
set omloader_iso=""
if [ -n "$vt_chosen_path" ]; then
  if ! regexp '[ ]' "$vt_chosen_path"; then set omloader_iso="omloader.isofile=$vt_chosen_path"; fi
fi

# ---- display: biggest mode the firmware offers, kept for the Linux console (gfxpayload=keep) ----
# Skipped under Ventoy (it drives the display itself) and with omloader.gfx=off in omloader_args (extra.cfg). Serial stays active.
# Mode: menu "Display resolution" ($omloader_gfx_pick) > omloader.gfx=WxH in $omloader_args > the preference list below.
# The reachable maximum is the firmware's GOP mode list (OVMF: up to 1920x1080 via the QEMU display device; real hardware: native).
set omloader_gfx_list="1920x1080,1600x900,1366x768,1280x800,1280x720,1024x768,auto"
if [ -z "$vt_chosen_path" ]; then
  set omloader_gfx_sel=""
  regexp --set 1:omloader_gfx_sel 'omloader\.gfx=([^ ]+)' "$omloader_args"
  if [ -n "$omloader_gfx_pick" ]; then set omloader_gfx_sel="$omloader_gfx_pick"; fi
  if [ "$omloader_gfx_sel" != "off" ]; then
    insmod all_video
    insmod gfxterm
    insmod gfxterm_background
    if [ -n "$omloader_gfx_sel" -a "$omloader_gfx_sel" != "auto" ]; then
      set gfxmode="$omloader_gfx_sel,$omloader_gfx_list"
    else
      set gfxmode="$omloader_gfx_list"
    fi
    set gfxpayload=keep
    if loadfont ($root)/boot/grub/fonts/unicode.pf2; then
      if terminal_output --append gfxterm; then
        terminal_output --remove console
        background_color 46,52,64
        set color_normal=light-gray/black
        set color_highlight=white/blue
        set menu_color_normal=light-gray/black
        set menu_color_highlight=white/blue
      fi
    fi
  fi
fi

menuentry "OCI Metal Loader - Start (TUI; auto-boot if configured)" {
  linux /boot/vmlinuz console=tty0 console=ttyS0,115200 loglevel=4 systemd.show_status=auto vt.default_utf8=1 $omloader_iso $omloader_args
  initrd /boot/initrd.img
}
# Safe display: a KMS driver (virtio_gpu, bochs-drm in QEMU/libvirt VMs) is loaded ~3 s after boot and replaces the firmware framebuffer with
# its own preferred mode (measured: GRUB/efifb 1920x1080 -> 1280x800). `nomodeset` keeps the GRUB mode. NOT the default: the native drivers stay enabled
# so container guests (they run on the loader kernel) keep native GPU drivers, multi-monitor and acceleration. Real hardware normally needs no such entry.
menuentry "OCI Metal Loader - Safe display (nomodeset; use for VM guests on AMD iGPU)" {
  linux /boot/vmlinuz console=tty0 console=ttyS0,115200 loglevel=4 systemd.show_status=auto vt.default_utf8=1 nomodeset $omloader_iso $omloader_args
  initrd /boot/initrd.img
}
menuentry "OCI Metal Loader - Shell (no TUI, for debugging)" {
  linux /boot/vmlinuz console=tty0 console=ttyS0,115200 loglevel=4 systemd.show_status=auto vt.default_utf8=1 $omloader_iso
  initrd /boot/initrd.img
}
if [ -z "$vt_chosen_path" ]; then
  submenu "Display resolution of this menu" {
    menuentry "Auto (best of 1920x1080 ... 1024x768)" { set omloader_gfx_pick=auto; configfile ($root)/boot/grub/grub.cfg }
    menuentry "1920x1080" { set omloader_gfx_pick=1920x1080; configfile ($root)/boot/grub/grub.cfg }
    menuentry "1280x720" { set omloader_gfx_pick=1280x720; configfile ($root)/boot/grub/grub.cfg }
    menuentry "1024x768" { set omloader_gfx_pick=1024x768; configfile ($root)/boot/grub/grub.cfg }
    menuentry "800x600" { set omloader_gfx_pick=800x600; configfile ($root)/boot/grub/grub.cfg }
    menuentry "Text mode (no graphics)" { set omloader_gfx_pick=off; configfile ($root)/boot/grub/grub.cfg }
  }
fi
