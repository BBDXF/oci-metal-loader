serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=1
set default=0
set omloader_args=""
# test harness may inject extra.cfg (sets omloader_args) via xorriso
if [ -f /boot/grub/extra.cfg ]; then source /boot/grub/extra.cfg; fi
# Ventoy GRUB2 mode runs this file with the ISO loop-mounted: hint stage 1 which file to loop-mount (it also finds it by scanning)
set omloader_iso=""
if [ -n "$vt_chosen_path" ]; then
  if ! regexp '[ ]' "$vt_chosen_path"; then set omloader_iso="omloader.isofile=$vt_chosen_path"; fi
fi
menuentry "OCI Metal Loader (auto if omloader.image= given)" {
  linux /boot/vmlinuz console=tty0 console=ttyS0,115200 loglevel=4 systemd.show_status=auto $omloader_iso $omloader_args
  initrd /boot/initrd.img
}
menuentry "OCI Metal Loader (interactive shell)" {
  linux /boot/vmlinuz console=tty0 console=ttyS0,115200 loglevel=4 systemd.show_status=auto $omloader_iso
  initrd /boot/initrd.img
}
