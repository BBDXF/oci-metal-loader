storage:
  images:
    label: [VTOYDATA, OMLOADER]
    path: /omloader/images
  snapshots:
    label: OMLOADER
    path: /snapshots
    fs_required: [ext4, btrfs, xfs]
    fallback: tmpfs
    # store-file mode: an ext4 image (label OMLOADER) on the host partition (exFAT/NTFS/vfat<4G/ext4...). A real
    # OMLOADER partition always wins; only files whose ext4 label is OMLOADER count.
    store_file:
      enabled: true
      path: ""                       # exact file inside the host partition (checked first)
      glob: [/omloader/store.img, /omloader/*.dat, /omloader/*.img, /ventoy/*.dat]   # in this order; first ext4 file labelled OMLOADER wins
      host_match: {label: "", uuid: ""}            # empty = the loader data partition (VTOYDATA, else the ISO partition); label/uuid restrict it
      auto_create: true              # no OMLOADER partition/file found + host writable: create omloader/store.img at boot
      size: 20G                      # size of the auto-created store (also `store create` default); shrunk to what fits if >= 4G
      prealloc: auto                 # auto: yes on exfat/vfat (no sparse files), no elsewhere
snapshot:
  max_chain_depth: 5
  persistent: true
  retention:
    keep_last: 10
    min_free_percent: 10
    keep_tagged: true
verify:
  base_checksum: sha256
boot:
  timeout: 10
  default_snapshot: current
  kernel_cmdline_extra: ""
  vm_fix_esp_fstab: true   # lxd-vm: make the guest's /boot/efi mount nofail (the ESP is not mapped with udev links; avoids a 90 s emergency-mode timeout)
  remember_last: true   # TUI records the last booted image/snapshot (<data>/omloader/last-boot); default_image: last boots it
  ui: tui          # tui | shell (console at boot when nothing is booted automatically; omloader.ui= kernel flag wins)
data:
  default_backend: dir
  default_vm_backend: ext4-file
  default_location: /OMLOADER/data
  auto_home_volume: true
  fallback_if_missing: system-layer
devices:
  policy: isolate
  windows_ntfs: ro_or_hide
  hibernated_fs: refuse
network:
  timeout_sec: 15
  retries: 3
  proxy: ""        # http://host:port | https://... | socks5://host:port
  no_proxy: ""     # comma separated hosts / domain suffixes / CIDRs
  extra_ca: ""     # PEM file added to the system CA pool
  dns: []
mirror_policy:
  strategy: fallback   # fallback | fastest | mirror-only
  health_check: true
  cache_ttl_hours: 24
  region_preset: global   # cn: also try the region: cn servers of every source (configs/sources.yaml) as fallbacks
# sources: the built-in sources/mirrors catalog lives in configs/sources.yaml (embedded; user copy: omloader/sources.yaml on the data partition)
cache:
  path: /OMLOADER/cache
  max_size_gb: 20
  offline: auto   # auto | on (never go online) | off (always check upstream)
policy:
  allow_online: true
  allowed_sources: []   # empty = all sources
experimental:
  oci_images: true    # Docker/OCI images: EXPERIMENTAL, on by default; false (or OML_EXPERIMENTAL=off / omloader.experimental=off) switches it off
# Console accounts provisioned at boot into every image (lxd-container, lxd-vm and experimental oci). The password below is PUBLIC:
# change it here, in your omloader.yaml, or per image in image.yaml. Merge rules (the image always wins): see docs/DEVELOPMENT.md.
#   image `runtime.users` set (even `[]`)      -> replaces `users`
#   image root_password / root_password_hash   -> replaces root_password
#   image autologin or autologin_user set      -> replaces autologin + autologin_user
guest_defaults:
  hostname: image         # image = the image name as an RFC 1123 label (vm-ubuntu-noble); keep = leave the guest's own; or a literal name. image.yaml runtime.hostname wins
  host_disks:             # the machine's own disks/partitions inside guests: /mnt/disks/<disk>/<label> (default ON, like Ventoy's plain data partition)
    mode: rw              # rw (default) | ro | off
    disks: boot           # boot (disk holding the loader data partition) | all
    mount_root: /mnt/disks
    automount: true       # fstab noauto,x-systemd.automount: nothing is mounted until accessed
    force_rw_data: true   # false = keep the omloader data/store partition read-only. NEVER delete/move omloader/ (store.img!) on it
  autologin: true
  autologin_user: oci
  root_password: Oci123
  users:
    - name: oci
      password: Oci123
      sudo: true            # password sudo (sudoers.d drop-in "oci ALL=(ALL:ALL) ALL"), plus group sudo when it exists
      groups: [sudo]
