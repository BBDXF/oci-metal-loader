storage:
  images:
    label: [VTOYDATA, OMLOADER]
    path: /images
  snapshots:
    label: OMLOADER
    path: /snapshots
    fs_required: [ext4, btrfs, xfs]
    fallback: tmpfs
    # store-file mode: an ext4 image (label OMLOADER) on the host partition (exFAT/NTFS/vfat<4G/ext4...). A real
    # OMLOADER partition always wins; only files whose ext4 label is OMLOADER count.
    store_file:
      enabled: true
      path: ""                       # exact file inside the host partition (checked first)
      glob: [/omloader/store.img, /ventoy/*.dat]   # Ventoy persistence-file convention
      host_match: {label: VTOYDATA, uuid: ""}     # uuid wins over label
      size: 20G                      # default for `omloader store create`
      prealloc: auto                 # auto: yes on exfat/vfat (no sparse files), no elsewhere
snapshot:
  max_chain_depth: 5
  persistent: true
  auto_snapshot_on_boot: false
  retention:
    keep_last: 10
    min_free_percent: 10
    keep_tagged: true
verify:
  base_checksum: sha256
boot:
  timeout: 5
  default_snapshot: current
  kernel_cmdline_extra: ""
data:
  default_backend: dir
  default_vm_backend: ext4-file
  default_location: /OMLOADER/data
  auto_home_volume: true
  fallback_if_missing: system-layer
devices:
  policy: isolate
  windows_ntfs: ro_or_hide
  hibernated_fs: refuse
network:
  timeout_sec: 15
  retries: 3
  proxy: ""        # http://host:port | https://... | socks5://host:port
  no_proxy: ""     # comma separated hosts / domain suffixes / CIDRs
  extra_ca: ""     # PEM file added to the system CA pool
  dns: []
mirror_policy:
  strategy: fallback   # fallback | fastest | mirror-only
  health_check: true
  cache_ttl_hours: 24
  region_preset: global
sources:
  lxc-images:
    type: simplestreams
    url: https://images.linuxcontainers.org
    mirrors: []      # region_preset: cn adds UNVERIFIED tuna/nju presets (content is digest-checked anyway)
  dockerhub:
    type: oci-registry
    url: registry-1.docker.io
cache:
  path: /OMLOADER/cache
  max_size_gb: 20
  offline: auto   # auto | on (never go online) | off (always check upstream)
policy:
  allow_online: true
  allowed_sources: []   # empty = all sources
experimental:
  oci_images: false   # Docker/OCI images: experimental, disabled by default (env OML_EXPERIMENTAL=oci / --experimental-oci)
