# Overrides on top of built-in defaults.
snapshot:
  max_chain_depth: 8
boot:
  timeout: 10
mirror_policy:
  region_preset: cn
# Docker/OCI images are experimental and off by default:
# experimental:
#   oci_images: true
# Online pull (M4): mirrors, proxy, cache
# sources:
#   lxc-images:
#     type: simplestreams
#     url: https://images.linuxcontainers.org
#     mirrors: [https://mirror.example.org/lxc-images]
# network: {proxy: "http://proxy.lan:3128", no_proxy: ".lan"}
# cache: {path: /OMLOADER/cache, offline: auto}
# Store-file mode: keep snapshots/data in an ext4 image on the (exFAT/NTFS) VTOYDATA partition instead of a Linux partition.
# Create it with `omloader store create --path /mnt/images/omloader/store.img --size 20G`.
# storage:
#   snapshots:
#     store_file:
#       glob: [/omloader/store.img, /ventoy/*.dat]
#       host_match: {label: VTOYDATA}
#       size: 20G
#       prealloc: auto
